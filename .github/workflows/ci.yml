name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WhipRadio.slnx

      - name: Build
        run: dotnet build WhipRadio.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WhipRadio.slnx --no-build --configuration Release --verbosity normal
