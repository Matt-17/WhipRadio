name: docker-publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: orchestrator, context: ., dockerfile: src/WhipRadio.Orchestrator/Dockerfile }
          - { name: web, context: ., dockerfile: src/WhipRadio.Web/Dockerfile }
          - { name: tts, context: sidecars/tts, dockerfile: sidecars/tts/Dockerfile }
          - { name: musicgen, context: sidecars/musicgen, dockerfile: sidecars/musicgen/Dockerfile }
          - { name: acestep, context: sidecars/acestep, dockerfile: sidecars/acestep/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/whip-radio-${{ matrix.name }}:latest
